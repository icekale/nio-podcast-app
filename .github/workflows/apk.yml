name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk
      - run: mv build/app/outputs/flutter-apk/app-release.apk NIO-Radio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NIO-Radio
          path: NIO-Radio.apk
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title v1.0.0 --notes "NIO Radio Flutter Android APK"
          gh release upload v1.0.0 NIO-Radio.apk --clobber
