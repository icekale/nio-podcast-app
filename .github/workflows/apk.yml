name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # subosito/flutter-action v2.23.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Resolve version from pubspec
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug signing"
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: |
          flutter build apk --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
          mv build/app/outputs/flutter-apk/app-release.apk NIO-Radio.apk
          flutter build apk --target-platform android-arm --obfuscate --split-debug-info=build/symbols
          mv build/app/outputs/flutter-apk/app-release.apk NIO-Radio-armv7.apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NIO-Radio
          path: |
            NIO-Radio.apk
            NIO-Radio-armv7.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(printf '%s\n' \
            'NIO Radio '"$VERSION" \
            '' \
            'Flutter 原生客户端（非 WebView）。首页今日推荐、全部专辑、搜索、专辑页、播放器、播放列表。' \
            '' \
            '下载' \
            '- 现机（arm64）：NIO-Radio.apk' \
            '- 32 位老机型：NIO-Radio-armv7.apk' \
            '' \
            '首次安装请允许通知权限，锁屏和下拉菜单才会显示播放卡片。')"
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "NIO Radio $VERSION" --notes "$NOTES" --latest
          gh release upload "v$VERSION" NIO-Radio.apk NIO-Radio-armv7.apk --clobber
